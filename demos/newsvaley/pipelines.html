<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipelines · The Daily Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css" />
  <style>
    /* Page-specific: pipeline diagram */
    .pipeline {
      display: flex; align-items: flex-end; gap: 4px;
      padding: 14px 4px 0;
    }
    .stage { display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 0; }
    .stage-bar-track {
      height: 140px;
      background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
      border: 0.5px solid var(--rule);
      display: flex; align-items: flex-end;
      overflow: hidden;
    }
    .stage-bar {
      width: 100%;
      transition: height 240ms cubic-bezier(.2,.7,.3,1);
      opacity: 0.85;
    }
    .stage-meta {
      text-align: center;
      padding-top: 2px;
    }
    .stage-count {
      font-family: var(--serif-display);
      font-size: 26px; font-weight: 500;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stage-label {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }
    .stage-arrow {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
      width: 56px;
      color: var(--muted);
      padding-bottom: 36px;
    }
    .stage-arrow svg { width: 28px; height: 16px; }
    .stage-arrow span {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-2);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="staff-chrome.jsx"></script>
  <script type="text/babel" src="pipelines.jsx"></script>
</body>
</html>
